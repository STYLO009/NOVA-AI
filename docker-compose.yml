# ── NOVA — full stack in Docker ──────────────────────────────────────────────
#
#   docker compose up --build
#   → UI:   http://localhost:8080
#   → API:  http://localhost:8000   (also reachable via http://localhost:8080/api)
#   → Docs: http://localhost:8080/docs
#
# Qdrant stays inside the compose network. To open its dashboard, uncomment the
# `ports:` block under the `qdrant` service and bring the stack back up.
#
# Data survives `docker compose down` via named volumes. Windows-only tools
# (app control / PowerShell) detect a Linux container and disable themselves;
# file, web, memory, system and search tools keep working everywhere.

name: nova

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      # Attestation manifests crashed the local buildkit daemon during export;
      # they add no value for a private single-host stack, so keep them off.
      provenance: "false"
    image: nova-backend:latest
    container_name: nova-backend
    restart: unless-stopped
    environment:
      NOVA_HOST: 0.0.0.0
      NOVA_PORT: 8000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      NOVA_WORKSPACE: /data/nova
      # The container reaches FastAPI itself; browser-origin checks live in nginx.
      NOVA_CORS_ORIGINS: ${NOVA_CORS_ORIGINS:-*}
      NOVA_AUTH_ENABLED: ${NOVA_AUTH_ENABLED:-true}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-168}
      # Vector DB: Qdrant server first, embedded file fallback second.
      QDRANT_URL: http://qdrant:6333
      QDRANT_LOCAL_PATH: /srv/nova/backend/data/qdrant
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-nova_memory}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-auto}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-384}
      # Optional model + embedding credentials.
      HF_TOKEN: ${HF_TOKEN:-}
      HF_MODEL: ${HF_MODEL:-Qwen/Qwen2.5-7B-Instruct}
      NOVA_LOCAL_MODEL: ${NOVA_LOCAL_MODEL:-}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      # Remaining knobs — defaults mirror backend/.env.example so a container
      # behaves exactly like a local `uvicorn` unless you override them here.
      CONFIRMATION_TIMEOUT_SECONDS: ${CONFIRMATION_TIMEOUT_SECONDS:-180}
      POWERSHELL_TIMEOUT_SECONDS: ${POWERSHELL_TIMEOUT_SECONDS:-30}
      ENABLE_BROWSER_AUTOMATION: ${ENABLE_BROWSER_AUTOMATION:-true}
      PBKDF2_ITERATIONS: ${PBKDF2_ITERATIONS:-390000}
    volumes:
      - nova-data:/data/nova
      - nova-db:/srv/nova/backend/data
    ports:
      - "${NOVA_BACKEND_PORT:-8000}:8000"
    depends_on:
      qdrant:
        condition: service_healthy
    networks:
      - nova

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: nova-qdrant
    restart: unless-stopped
    volumes:
      - qdrant-data:/qdrant/storage
    # Not published on the host by default — it is a database, not an app, and
    # 6333 is a popular port. To reach the dashboard, uncomment:
    #   ports:
    #     - "${NOVA_QDRANT_PORT:-6333}:6333"
    healthcheck:
      test:
        ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - nova

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      provenance: "false"
      args:
        # Same origin → nginx forwards /api to the backend container.
        VITE_API_URL: /
    image: nova-frontend:latest
    container_name: nova-frontend
    restart: unless-stopped
    ports:
      - "${NOVA_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - nova

volumes:
  nova-data:
  nova-db:
  qdrant-data:

networks:
  nova:
    driver: bridge
